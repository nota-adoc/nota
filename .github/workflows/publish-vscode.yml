# Publish the Nota VS Code extension (.vsix) to VS Code Marketplace (OIDC Trusted Publishing) and Open VSX.
#
# Authentication:
#   - VS Code Marketplace uses OIDC Trusted Publishing configured on publisher `nota-adoc` (no PAT secret required).
#   - Open VSX optionally uses repository secret `OVSX_PAT` (Access Token for namespace `nota-adoc`).
#
# Pre-release versions:
#   - On GitHub Release (`published`), `--pre-release` is passed when the release is marked as a pre-release.
#   - On manual `workflow_dispatch`, `--pre-release` is controlled by the `pre_release` input (true by default for 0.x).
name: Publish VS Code Extension

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      pre_release:
        description: Publish as pre-release
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build VSIX and publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- --project vscode-host --maxWorkers 2

      - name: Determine release flags
        id: meta
        run: |
          if [ "${{ (github.event_name == 'workflow_dispatch' && inputs.pre_release) || (github.event_name == 'release' && github.event.release.prerelease) }}" = "true" ]; then
            echo "flag=--pre-release" >> "$GITHUB_OUTPUT"
          else
            echo "flag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package VSIX
        run: |
          npm run build -w packages/vscode
          cd packages/vscode
          npx vsce package --no-dependencies ${{ steps.meta.outputs.flag }}

      - name: Publish to VS Code Marketplace (OIDC)
        run: npx vsce publish --oidc ${{ steps.meta.outputs.flag }} --packagePath packages/vscode/nota-vscode-*.vsix

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "OVSX_PAT is not configured; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx publish ${{ steps.meta.outputs.flag }} packages/vscode/nota-vscode-*.vsix
